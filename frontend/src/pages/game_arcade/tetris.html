<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy-DART | 밸런스 시트 테트리스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700;1,800&family=Outfit:wght@500;700;900&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans selection:bg-emerald-500 selection:text-white">

  <!-- GNB Header -->
  <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-cyan-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-emerald-500/20">
            🧩
          </div>
          <div>
            <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Easy-DART</span>
            <span class="hidden sm:inline-block ml-2 text-xs font-bold px-2 py-0.5 bg-emerald-950/80 text-emerald-300 rounded-full border border-emerald-800">회계 테트리스</span>
          </div>
        </a>

        <nav class="flex items-center space-x-2">
          <a href="index.html" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> 오락실 로비
          </a>
          <a href="radar_shooter.html" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex items-center gap-1.5">
            <i data-lucide="crosshair" class="w-4 h-4"></i> 공시 미사일 슈팅
          </a>
          <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow flex items-center gap-1.5">
            <i data-lucide="grid" class="w-4 h-4"></i> 밸런스 테트리스
          </span>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-4">
    <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
      <h1 class="text-base font-black text-white flex items-center gap-2">
        <span>⚖️</span> 밸런스 시트 테트리스 : <span class="text-emerald-400">자산 = 부채 + 자본</span>
      </h1>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white font-medium">← 오락실로 돌아가기</a>
    </div>

    <!-- Tetris Frame -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
      <div class="space-y-4">
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-center space-y-2">
          <div class="text-xs font-bold text-slate-400">보관 블록 (HOLD) [C]</div>
          <canvas id="holdCanvas" width="100" height="80" class="mx-auto bg-slate-950 rounded-xl"></canvas>
          <div id="holdName" class="text-[11px] text-slate-400">-</div>
        </div>
      </div>

      <div class="md:col-span-2 relative">
        <canvas id="tetrisCanvas" width="280" height="560" class="mx-auto bg-slate-950 rounded-2xl border border-slate-800 shadow-xl"></canvas>
      </div>

      <div class="space-y-4">
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-center space-y-2">
          <div class="text-xs font-bold text-slate-400">다음 블록 (NEXT)</div>
          <canvas id="nextCanvas" width="100" height="80" class="mx-auto bg-slate-950 rounded-xl"></canvas>
          <div id="nextName" class="text-[11px] text-emerald-400">-</div>
        </div>

        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
          <div class="text-xs font-bold text-slate-400">결산 점수</div>
          <div id="scoreText" class="text-2xl font-black text-amber-400">0</div>
          <div class="text-xs font-bold text-slate-400">완료한 라인</div>
          <div id="linesText" class="text-xl font-black text-white">0 줄</div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { BalanceSheetTetris } from './games/bs_tetris.js';
    lucide.createIcons();

    const canvas = document.getElementById('tetrisCanvas');
    const holdCanvas = document.getElementById('holdCanvas');
    const nextCanvas = document.getElementById('nextCanvas');

    const scoreText = document.getElementById('scoreText');
    const linesText = document.getElementById('linesText');
    const holdName = document.getElementById('holdName');
    const nextName = document.getElementById('nextName');

    const game = new BalanceSheetTetris(canvas, {
      onStateChange: (s) => {
        scoreText.textContent = s.score.toLocaleString();
        linesText.textContent = `${s.clearedLines} 줄`;
        if (s.nextPiece) nextName.textContent = s.nextPiece.name;
        if (s.holdPiece) holdName.textContent = s.holdPiece.name;
      }
    });

    game.start();
  </script>
</body>
</html>
